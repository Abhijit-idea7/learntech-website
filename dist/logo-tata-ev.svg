<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none">
  <!-- tata.ev wordmark — lowercase matching Tata.ev brand identity -->
  <!-- "tata." in regular weight, ".ev" slightly bolder -->
  <text
    x="4" y="52"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="48"
    fill="white"
    letter-spacing="1"
  >tata.</text>
  <text
    x="138" y="52"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="48"
    fill="white"
  >ev</text>
  <!-- Curved swoosh arc beneath "ev" — characteristic Tata.ev brand element -->
  <path
    d="M138 58 Q168 72 196 58"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
</svg>
